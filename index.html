<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>대운교통 17번 노선 교육용 내비게이션</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; }
        #map { width: 100%; height: 100%; }
        
        #nav-bar {
            position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
            background: #111827; color: white; padding: 15px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        #turn-instruction { font-size: 24px; font-weight: 900; color: #fde047; margin-bottom: 4px; }
        #next-station { font-size: 16px; color: #67e8f9; font-weight: bold; margin-bottom: 2px; }
        .navi-btn { margin-top: 10px; padding: 10px 20px; background: #fee500; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: black; font-size: 16px;}
        
        #control-panel {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 12px 24px; border-radius: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 15px;
        }
        .btn { background: #059669; color: white; border: none; padding: 12px 24px; border-radius: 25px; font-size: 15px; font-weight: bold; cursor: pointer; }
        #gps-debug { font-size: 13px; color: #1e293b; font-weight: 600; }
    </style>
</head>
<body>

    <div id="nav-bar">
        <div id="turn-instruction">안내 시작 버튼을 누르십시오</div>
        <div id="next-station">안내 대기 중</div>
        <button class="navi-btn" onclick="openKakaoNavi()">현재 목적지 카카오내비로 열기</button>
    </div>

    <div id="map"></div>

    <div id="control-panel">
        <button class="btn" id="start-btn" onclick="startNavigation()">내비게이션 안내 시작</button>
        <div id="gps-debug">GPS 위성 신호 대기 중...</div>
    </div>

    <script>
        // 정류장 데이터 (기사님 데이터)
        var rawRouteData = [
            {"spotSn":1,"routeName":"불모산종점","xCrdnt":128.72331574,"yCrdnt":35.19030864},
            // ... (기존에 주신 데이터가 여기 포함되어 있습니다)
            {"spotSn":179,"routeName":"북면종점","xCrdnt":128.6115508,"yCrdnt":35.35341769}
        ]; 
        
        var targetStationIdx = 0;
        var lastSpokenStation = "";

        // 카카오내비 호출 함수
function openKakaoNavi() {
    var nextStation = rawRouteData[targetStationIdx];
    if (nextStation) {
        // 필수 파라미터인 coordType을 wgs84로 명시
        var url = `kakaonavi://navigate?name=${encodeURIComponent(nextStation.routeName)}&x=${nextStation.xCrdnt}&y=${nextStation.yCrdnt}&coordType=wgs84`;
        window.location.href = url;
    }
}
        // 기존 로직에 정류장 도착 시 자동 호출 기능 추가
        // [테스트 전용] 가상 주행 모드
var testIdx = 0;
function runTestMode() {
    if (testIdx < rawRouteData.length) {
        var testPos = {
            coords: {
                latitude: rawRouteData[testIdx].yCrdnt,
                longitude: rawRouteData[testIdx].xCrdnt,
                speed: 30
            }
        };
        // 시스템에 가상 좌표를 강제로 주입
        processNavigationEngine(testPos);
        testIdx++;
        // 5초마다 다음 정류장으로 이동하는 것처럼 시뮬레이션
        setTimeout(runTestMode, 5000); 
    } else {
        alert("가상 주행 테스트가 완료되었습니다.");
    }
}
function processNavigationEngine(position) {
            // ... (기존 좌표 계산 로직)
            
            // [정류장 40미터 안착 시]
            if (distanceToStation <= 40 && lastSpokenStation !== nextStation.routeName) {
                lastSpokenStation = nextStation.routeName;
                speak(`이번 정류장은 ${nextStation.routeName}입니다.`);
                
                // 3초 뒤에 자동으로 카카오내비 목적지를 다음 정류장으로 갱신하여 호출
                setTimeout(openKakaoNavi, 3000); 

                if (targetStationIdx < rawRouteData.length - 1) {
                    setTimeout(() => { targetStationIdx++; }, 5000);
                }
            }
        }
        
        // (나머지 지도 생성 및 GPS 설정 함수는 기존과 동일하게 유지하시면 됩니다)
    </script>
</body>
</html>
