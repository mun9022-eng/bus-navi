    var pathCoords = rawRouteData.map(item => [item.yCrdnt, item.xCrdnt]);
    L.polyline(pathCoords, { color: 'red', weight: 5 }).addTo(map);

    rawRouteData.forEach(item => {
        L.circleMarker([item.yCrdnt, item.xCrdnt], { radius: 4, color: 'blue' })
         .addTo(map)
         .bindPopup(item.routeName);
    });

    // 3. 내비게이션 기능
    function startNavigation() {
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(function(pos) {
                var lat = pos.coords.latitude;
                var lng = pos.coords.longitude;
                map.setView([lat, lng], 16);
            }, null, { enableHighAccuracy: true });
