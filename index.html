<html>
<head>
    <meta charset="utf-8">
    <title>대운교통 17번 노선 교육용 내비게이션</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; }
        #map { width: 100%; height: 100%; }
        
        /* [핵심] 상단 내비게이션 HUD 가이드 바 */
        #nav-bar {
            position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
            background: #111827; color: white; padding: 15px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        #turn-instruction { font-size: 28px; font-weight: 900; color: #fde047; margin-bottom: 4px; }
        #next-station { font-size: 16px; color: #67e8f9; font-weight: bold; margin-bottom: 2px; }
        #nav-status { font-size: 13px; color: #9ca3af; }

        /* 하단 제어판 및 GPS 디버그 창 */
        #control-panel {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 12px 24px; border-radius: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 15px;
        }
        .btn {
            background: #059669; color: white; border: none; padding: 12px 24px;
            border-radius: 25px; font-size: 15px; font-weight: bold; cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }
        #gps-debug { font-size: 13px; color: #1e293b; font-weight: 600; white-space: nowrap; }
    </style>
</head>
<body>

    <!-- 내비게이션 HUD 화면 -->
    <div id="nav-bar">
        <div id="turn-instruction">안내 시작 버튼을 누르십시오</div>
        <div id="next-station">안내 대기 중</div>
        <div id="nav-status">대운교통 17번 노선 실시간 지리 숙지 시스템</div>
    </div>

    <div id="map"></div>

    <!-- 하단 관제 시스템 패널 -->

            {"spotSn":175,"routeName":"북면농협","xCrdnt":128.6091275,"yCrdnt":35.35334524},
            {"spotSn":179,"routeName":"북면종점","xCrdnt":128.6115508,"yCrdnt":35.35341769}

        // 2. [★교차로 Turn-by-Turn 가이드 데이터★] 
        // 정류장 사이사이의 실제 지리적 회전/이탈 구간 좌표와 맞춤형 안내 정의
        var naviTurnPoints = [
            {
                // 한국전기연구원 출발 후 삼정자 교차로 진입 지점
                lat: 35.19321, lng: 128.71540,
                actionText: "약 200m 앞 우회전입니다.",
                spoken200: "약 200미터 앞 삼정자내리마을 방면으로 우회전입니다.",
                spoken50: "잠시 후 우회전입니다."
            },
            {
                // 가음정사거리 진입 구간
                lat: 35.20650, lng: 128.69010,
                actionText: "약 200m 앞 좌회전입니다.",
                spoken200: "약 200미터 앞 창원남중 방면으로 좌회전입니다. 1차로를 이용하세요.",
                spoken50: "잠시 후 좌회전입니다."
            },
            {
                // 시티7 앞 명서교차로 진입 구간
                lat: 35.24210, lng: 128.65110,
                actionText: "약 200m 앞 10시 방향 지하차도 옆길입니다.",
                spoken200: "약 200미터 앞 명서시장 방면으로 지하차도 오른쪽 옆길입니다.",
                spoken50: "잠시 후 우측 옆길로 진입하세요."
            }
            // ※ 현장 주행 교육을 하며 보완하고 싶은 교차로 좌표를 이 형식 그대로 아래에 계속 추가해 가시면 됩니다.
        ];

        // 노선 정렬 및 드로잉 배열 파싱
        rawRouteData.sort((a, b) => a.spotSn - b.spotSn);
        var pathCoords = rawRouteData.map(item => [item.yCrdnt, item.xCrdnt]);

        // 지도 셋팅 (1번 정류장 중심)
        var map = L.map('map').setView(pathCoords[0], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // 빨간색 버스 노선 궤적 표출
        L.polyline(pathCoords, { color: '#ef4444', weight: 6, opacity: 0.85 }).addTo(map);

        // 각 정류장 위치 표시
        rawRouteData.forEach(item => {
            L.circleMarker([item.yCrdnt, item.xCrdnt], {
                radius: 5, color: '#1e3a8a', fillColor: '#fff', fillOpacity: 1, weight: 2.5
            }).addTo(map).bindPopup(`<b>${item.routeName}</b>`);
        });

        // 내비게이션 추적 변수 전역 설정
        var currentBusMarker = null; 
        var watchId = null;          
        var targetStationIdx = 0;   // 다음 목표 정류장 번호
        var targetTurnIdx = 0;      // 다음 목표 교차로 번호
        
        // 중복 안내 방송을 차단하는 통제 플래그
        var lastSpokenStation = "";
        var turnSpeechFlags = { spoken200: false, spoken50: false };

        // 크롬 브라우저 하드웨어 TTS 음성 송출 엔진
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 딜레이 방지를 위해 기존 출력 전부 끊고 새로 발성
                var speech = new SpeechSynthesisUtterance(text);
                speech.lang = 'ko-KR';
                speech.rate = 1.05; // 웅얼거림 방지를 위해 미세하게 속도 상향
                window.speechSynthesis.speak(speech);
            }
        }

        // 거리 공식 계산기 (미터 환산)
        function getDistance(lat1, lon1, lat2, lon2) {
            var R = 6371000; 
            var dLat = (lat2 - lat1) * Math.PI / 180;
            var dLon = (lon2 - lon1) * Math.PI / 180;
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon/2) * Math.sin(dLon/2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // 스마트폰 내비게이션 실행 버튼 바인딩
        function startNavigation() {
            if (!navigator.geolocation) {
                alert("해당 태블릿/스마트폰에 고정밀 GPS 가 장착되어 있지 않거나 브라우저 권한이 막혀있습니다.");
                return;
            }
            document.getElementById('start-btn').disabled = true;
            document.getElementById('start-btn').innerText = "내비 안내 가동 중";
            speak("대운교통 17번 노선 정밀 가이드 내비게이션 안내를 가동합니다. 안전운전 하십시오.");

            // 초 단위 고정밀 차량 위치 모니터링 시작
            watchId = navigator.geolocation.watchPosition(processNavigationEngine, handleGPSError, {
                enableHighAccuracy: true, 
                maximumAge: 0,            
                timeout: 7000            
            });
        }

        // 실시간 연산 및 음성 제어 센터 (가장 중요)
        function processNavigationEngine(position) {
            var curLat = position.coords.latitude;
            var curLng = position.coords.longitude;
            var speed = position.coords.speed ? Math.round(position.coords.speed * 3.6) : 0; // 시속(km/h)으로 보정

            document.getElementById('gps-debug').innerText = `차량 실시간 좌표: ${curLat.toFixed(5)}, ${curLng.toFixed(5)} | 속도: ${speed} km/h`;

            // 1. 차량 동적 뷰 마커 업데이트 및 시점 동기화
            if (!currentBusMarker) {
                currentBusMarker = L.circleMarker([curLat, curLng], {
                    radius: 11, color: '#10b981', fillColor: '#10b981', fillOpacity: 1, weight: 3
                }).addTo(map);
            } else {
                currentBusMarker.setLatLng([curLat, curLng]);
            }
            // 지도 카메라이동 (시선 고정)
            map.setView([curLat, curLng], 16);


            // 2. [TURN-BY-TURN] 교차로 회전 가이드 계산 로직
            var activeTurn = naviTurnPoints[targetTurnIdx];
            if (activeTurn) {
                var distanceToTurn = getDistance(curLat, curLng, activeTurn.lat, activeTurn.lng);

                // 상단 HUD 1순위 노출 (회전 안내가 최우선)
                document.getElementById('turn-instruction').innerText = `${activeTurn.actionText.split("앞")[1] || activeTurn.actionText} (앞으로 ${Math.round(distanceToTurn)}m)`;

                // [회전 가이드 200m 전방 터짐]
                if (distanceToTurn <= 220 && distanceToTurn >= 180 && !turnSpeechFlags.spoken200) {
                    speak(activeTurn.spoken200);
                    turnSpeechFlags.spoken200 = true;
                }
                // [회전 가이드 50m 최종 낙하 진입]
                else if (distanceToTurn <= 65 && distanceToTurn >= 35 && !turnSpeechFlags.spoken50) {
                    speak(activeTurn.spoken50);
                    turnSpeechFlags.spoken50 = true;
                }
                // [교차로 완전히 이탈 및 통과 인정 판정]
                else if (distanceToTurn < 25) {
                    turnSpeechFlags = { spoken200: false, spoken50: false }; // 다음 교차로를 위해 초기화
                    targetTurnIdx++; // 다음 타겟 교차로로 타겟팅 스위칭
                }
            }


            // 3. [STATION] 정류장 진입 및 다음 역 가이드 계산 로직
            var nextStation = rawRouteData[targetStationIdx];
            if (nextStation) {
                var distanceToStation = getDistance(curLat, curLng, nextStation.yCrdnt, nextStation.xCrdnt);

                // 상단 HUD 서브 문구에 다음 역 정보 바인딩
                document.getElementById('next-station').innerText = `다음 정류장: ${nextStation.routeName} (남은 거리: ${Math.round(distanceToStation)}m)`;
                document.getElementById('nav-status').innerText = `대운교통 17번 종점 방면 | 운행 속도: ${speed} km/h`;

                // [정류장 40미터 권역 안착 스피커 개방 안내]
                if (distanceToStation <= 40 && lastSpokenStation !== nextStation.routeName) {
                    lastSpokenStation = nextStation.routeName;
                    speak(`이번 정류장은 ${nextStation.routeName}입니다.`);

                    // 안내 방송 송출 후 다음 정류장 번호로 연동 대기 전환
                    if (targetStationIdx < rawRouteData.length - 1) {
                        setTimeout(() => { targetStationIdx++; }, 5000);
                    } else {
                        document.getElementById('turn-instruction').innerText = "목적지에 도착했습니다.";
                        document.getElementById('next-station').innerText = "17번 운행 종료";
                    }
                }
            }
        }

        function handleGPSError(error) {
            console.error(error);
            document.getElementById('gps-debug').innerText = `위치 탐색 지연: 실외 주행로로 나가거나 기기 GPS 활성화를 확인하세요.`;
        }
    </script>
</body>
</html>
