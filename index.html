<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>대운교통 17번 노선 교육용 내비게이션</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; }
        #map { width: 100%; height: 100vh; display: block; }
        
        #nav-bar {
            position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
            background: #111827; color: white; padding: 15px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        #turn-instruction { font-size: 24px; font-weight: 900; color: #fde047; }
        #next-station { font-size: 14px; color: #67e8f9; margin-top: 5px; }

        #control-panel {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 10px 20px; border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn { background: #059669; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="nav-bar">
        <div id="turn-instruction">대운교통 17번 노선 안내</div>
        <div id="next-station">안내 시작 버튼을 누르세요</div>
    </div>

    <div id="map"></div>

    <div id="control-panel">
        <button class="btn" id="start-btn" onclick="startNavigation()">내비게이션 시작</button>
        <span id="gps-status" style="margin-left:10px; font-size:12px;">대기 중...</span>
    </div>

    <script>
        // 1. 데이터가 이미 정의되어 있는지 확인하고 없다면 빈 배열로 초기화
        var rawRouteData = typeof rawRouteData !== 'undefined' ? rawRouteData : [];
        
        // 2. 좌표가 있는 데이터만 골라내어 에러 방지 (핵심 수정)
        var validCoords = rawRouteData
            .filter(item => item && item.yCrdnt && item.xCrdnt)
            .map(item => [item.yCrdnt, item.xCrdnt]);

        // 3. 지도 초기화
        var map = L.map('map').setView(validCoords.length > 0 ? validCoords[0] : [35.2279, 128.6817], 14);
        
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // 4. 노선 그리기
        if (validCoords.length > 0) {
            L.polyline(validCoords, { color: '#ef4444', weight: 6 }).addTo(map);
        }

        var marker = null;

        function startNavigation() {
            document.getElementById('start-btn').innerText = "운행 중";
            document.getElementById('start-btn').disabled = true;
            
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(pos => {
                    var lat = pos.coords.latitude;
                    var lng = pos.coords.longitude;
                    
                    if (!marker) marker = L.circleMarker([lat, lng], {color: 'blue'}).addTo(map);
                    marker.setLatLng([lat, lng]);
                    map.setView([lat, lng], 16);
                    document.getElementById('gps-status').innerText = `위치: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                }, err => {
                    document.getElementById('gps-status').innerText = "GPS 신호 없음";
                }, { enableHighAccuracy: true });
            }
        }
    </script>
</body>
</html>
